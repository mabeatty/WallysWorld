<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EBTH Watch</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #14181f; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 8px 0 16px; color: #4a5461; }
  textarea { width: 100%; height: 110px; font: 12px/1.4 ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
  button { font: inherit; padding: 8px 14px; margin-right: 8px; cursor: pointer; }
  label { display: block; margin: 16px 0; }
  #out { margin-top: 20px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; background: #f1f3f5; padding: 12px; }
</style>
</head>
<body>
<h1>EBTH Watch</h1>
<p>Paste the connection code from your dashboard's Setup page, then save.</p>
<textarea id="code" placeholder='{"url":"https://...supabase.co","anonKey":"...","token":"..."}'></textarea>
<label><input type="checkbox" id="enabled"> Collect automatically while this browser is open</label>
<button id="save">Save and test</button>
<div id="out"></div>
<script src="options.js"></script>
</body>
</html>
